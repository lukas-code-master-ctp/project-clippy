<svg class="pet pet-brote s-listening" viewBox="0 0 200 200" style="--ov:var(--ink)" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><!-- Brote: cambia el estado con la clase s-sleeping | s-listening | s-thinking | s-working | s-done -->
<style>.pet{--ink:#18202b;--surface:#ffffff;--stage:#ffffff;--accent:#3b5bfd;--f-display:system-ui,sans-serif}
@media (prefers-color-scheme: dark){.pet{--ink:#e9edf4;--surface:#171c25;--stage:#171c25;--accent:#8ea2ff}}

.pet .shadow{fill:var(--ink);opacity:.12;transform-box:fill-box;transform-origin:center}
.pet .lift{transition:transform .5s ease}
.pet .rig{transform-box:fill-box;transform-origin:50% 100%}
.pet .e-open,.pet .e-closed,.pet .e-happy{transform-box:fill-box;transform-origin:center}
.pet .pupils{transition:transform .35s ease}
.pet .e-closed,.pet .e-happy,.pet .ov{display:none}

.pet.s-sleeping .e-open{display:none}
.pet.s-sleeping .e-closed{display:inline}
.pet.s-done .e-open{display:none}
.pet.s-done .e-happy{display:inline}

.pet.s-sleeping .lift{transform:translateY(8px)}
.pet.s-sleeping .rig{animation:breathe 3.6s ease-in-out infinite}
.pet.s-listening .rig{animation:tilt 2.4s ease-in-out infinite}
.pet.s-listening .e-open{animation:blink 4.2s infinite}
.pet.s-thinking .rig{animation:sway 3.2s ease-in-out infinite}
.pet.s-thinking .e-open{animation:blink 5s infinite 1s}
.pet.s-thinking .pupils{transform:translate(3px,-4px)}
.pet.s-working .rig{animation:bob .5s ease-in-out infinite}
.pet.s-working .e-open{transform:scaleY(.65)}
.pet.s-working .pupils{transform:translate(0,2px)}
.pet.s-working .shadow{animation:shadowBob .5s ease-in-out infinite}
.pet.s-done .rig{animation:jump 1.3s ease-out infinite}
.pet.s-done .shadow{animation:shadowJump 1.3s ease-out infinite}

.pet.s-sleeping .ov-zzz,.pet.s-listening .ov-waves,.pet.s-thinking .ov-dots,.pet.s-working .ov-gear,.pet.s-done .ov-check{display:inline}
.ov{color:var(--ov)}
.ov .z{font:800 18px var(--f-display);fill:currentColor;opacity:0;animation:zfloat 3s ease-in-out infinite}
.ov .z2{animation-delay:1s;font-size:22px}.ov .z3{animation-delay:2s;font-size:27px}
.ov .w{fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;opacity:0;animation:wave 1.4s ease-out infinite}
.ov .w2{animation-delay:.35s}
.ov .d{fill:currentColor;animation:dot 1.2s ease-in-out infinite}
.ov .d2{animation-delay:.2s}.ov .d3{animation-delay:.4s}
.ov .gear{transform-box:fill-box;transform-origin:center;animation:spin 1.6s linear infinite}
.ov .gear *{fill:currentColor}
.ov .gear .hole{fill:var(--stage)}
.ov .chk{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.3,1.6,.5,1) both}
.ov .chk circle{fill:currentColor}
.ov .chk path{fill:none;stroke:var(--surface);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}

@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,1.04)}}
@keyframes tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-3px)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-5px)}}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-7px) scale(1.02,.98)}}
@keyframes jump{0%{transform:translateY(0) scale(1,1)}14%{transform:translateY(0) scale(1.1,.88)}36%{transform:translateY(-26px) scale(.94,1.07)}56%{transform:translateY(0) scale(1.07,.93)}70%,100%{transform:translateY(0) scale(1,1)}}
@keyframes shadowBob{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.88)}}
@keyframes shadowJump{0%,14%,56%,100%{transform:scaleX(1)}36%{transform:scaleX(.6);opacity:.06}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes zfloat{0%{opacity:0;transform:translate(0,6px)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-12px)}}
@keyframes wave{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
@keyframes dot{0%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-5px);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes flame{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}
@keyframes ring{0%{opacity:.9;transform:scale(.92)}100%{opacity:0;transform:scale(1.25)}}

.pet .sprout{transform-box:fill-box;transform-origin:50% 100%;transition:transform .5s ease}
.pet-brote.s-sleeping .sprout{transform:rotate(-28deg)}
.pet-brote.s-thinking .sprout{animation:tilt 2.4s ease-in-out infinite}
.pet-brote.s-working .sprout{animation:tilt .4s linear infinite}
.pet-brote.s-done .sprout{transform:scale(1.15)}</style>
    <defs></defs>
    <ellipse class="shadow" cx="100" cy="184" rx="42" ry="6"></ellipse>
    <g class="lift"><g class="rig"><g class="sprout"><path d="M100 82 Q100 70 100 62" stroke="var(--ink)" stroke-width="4" stroke-linecap="round" fill="none"></path>
        <path d="M100 66 Q86 52 78 60 Q88 72 100 66Z" fill="var(--accent)"></path><path d="M100 62 Q114 46 124 54 Q114 68 100 62Z" fill="var(--accent)"></path></g>
        <rect x="54" y="80" width="92" height="88" rx="32" fill="var(--surface)" stroke="var(--ink)" stroke-width="5"></rect>
      <g class="e-open"><g class="pupils"><circle cx="84" cy="122" r="5.5" fill="var(--ink)"></circle><circle cx="116" cy="122" r="5.5" fill="var(--ink)"></circle></g></g><g class="e-closed"><path d="M78 123 Q84 128 90 123 M110 123 Q116 128 122 123" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"></path></g><g class="e-happy"><path d="M78 125 Q84 116 90 125 M110 125 Q116 116 122 125" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"></path></g>
    </g></g>
<g class="ov ov-zzz"><text class="z z1" x="138" y="64">z</text><text class="z z2" x="152" y="48">z</text><text class="z z3" x="166" y="30">Z</text></g>
<g class="ov ov-waves"><path class="w w1" d="M36 98 Q28 114 36 130"></path><path class="w w2" d="M24 90 Q12 114 24 138"></path><path class="w w1" d="M164 98 Q172 114 164 130"></path><path class="w w2" d="M176 90 Q188 114 176 138"></path></g>
<g class="ov ov-dots"><circle class="d d1" cx="146" cy="40" r="4.5"></circle><circle class="d d2" cx="161" cy="40" r="4.5"></circle><circle class="d d3" cx="176" cy="40" r="4.5"></circle></g>
<g class="ov ov-gear" transform="translate(164 38)"><g class="gear"><rect x="-3" y="-13" width="6" height="26" rx="1"></rect><rect x="-3" y="-13" width="6" height="26" rx="1" transform="rotate(45)"></rect><rect x="-3" y="-13" width="6" height="26" rx="1" transform="rotate(90)"></rect><rect x="-3" y="-13" width="6" height="26" rx="1" transform="rotate(135)"></rect><circle r="9"></circle><circle class="hole" r="3.5"></circle></g></g>
<g class="ov ov-check" transform="translate(164 40)"><g class="chk"><circle r="14"></circle><path d="M-6 0 L-1.5 5 L7 -5"></path></g></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>