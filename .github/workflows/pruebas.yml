name: Pruebas

# Pruebas unitarias y una prueba de voz de punta a punta:
# baja el modelo real de Whisper, sintetiza una frase en español y verifica la transcripción.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # whisper.cpp se compila para CPUs x86 de 2013 en adelante (AVX2), no solo para la del servidor de CI.
  GGML_NATIVE: "OFF"
  GGML_AVX: "ON"
  GGML_AVX2: "ON"
  GGML_FMA: "ON"
  GGML_F16C: "ON"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libssl-dev espeak-ng

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # whisper-rs-sys no se recompila al cambiar las variables GGML_*: cambiar esta clave fuerza a hacerlo.
          key: ggml-portable-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Interfaz (tipos y build)
        run: |
          npm ci
          npm run build

      - name: Pruebas unitarias
        working-directory: src-tauri
        run: cargo test --release

      - name: Cachear el modelo de Whisper
        uses: actions/cache@v4
        with:
          path: /tmp/brote-e2e
          key: whisper-ggml-small-q5_1

      - name: Voz de punta a punta (Whisper en español)
        working-directory: src-tauri
        run: |
          espeak-ng -v es -s 150 "Agenda una reunión con Juan mañana a las diez de la mañana" -w /tmp/frase.wav
          BROTE_TEST_WAV=/tmp/frase.wav BROTE_TEST_EXPECT="reunión" \
            cargo test --release -- --ignored --nocapture
