name: Instalador de Windows

# Compila Brote en Windows en cada pull request y deja el instalador (.msi y .exe)
# como artefacto descargable. Lo que llega a main lo publica release.yml.
on:
  pull_request:
  workflow_dispatch:

env:
  # whisper.cpp se compila para CPUs x86 de 2013 en adelante (AVX2), no solo para la del servidor de CI.
  GGML_NATIVE: "OFF"
  GGML_AVX: "ON"
  GGML_AVX2: "ON"
  GGML_FMA: "ON"
  GGML_F16C: "ON"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # whisper-rs-sys no se recompila al cambiar las variables GGML_*: cambiar esta clave fuerza a hacerlo.
          key: ggml-portable-v1

      - run: npm ci

      # Con la llave de firma, prueba también lo que hace release.yml (firma y latest.json) sin publicar nada.
      - name: Compilar instalador
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":true}}' > release.conf.json
            npm run tauri build -- --config release.conf.json
            node scripts/latest-json.mjs 0.1.0 https://example.invalid
          else
            npm run tauri build
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: brote-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
