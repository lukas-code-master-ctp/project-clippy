[package]
name = "brote"
version = "0.1.0"
description = "Brote, mascota de escritorio con comandos de voz"
edition = "2021"

[lib]
name = "brote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
whisper-rs = "0.16"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream", "json", "form", "query"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync", "time", "macros"] }
anyhow = "1"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
tauri-plugin-opener = "2"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
hound = "3"
